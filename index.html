<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name = "viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            touch-action: none;
            background-color: black;
        }
        html, body {
            image-rendering: pixelated;
            -webkit-text-size-adjust: none;
            text-size-adjust: none;
        }
        canvas {
            outline: none;
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
        }
        canvas:focus {
            outline: none;
        }
        .center {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100%;
        }
    </style>
</head>
<body>
    <div class = "center">
    <canvas id = "canvas"></canvas>
    </div>
    <script>
        "use strict"
        //スマホの長押しの振動を取り消し
        const canvas = document.getElementById("canvas");
        canvas.addEventListener("contextmenu", e => e.preventDefault());
        canvas.addEventListener("touchstart", e => e.preventDefault());
        canvas.addEventListener("touchend", e => e.preventDefault());
        canvas.addEventListener("touchmove", e => e.preventDefault());
        const himi_js = {
            canvas: null,
            ctx: null,

            last_window_width: 0,
            last_window_height: 0,

            font_name: "sans-serif",

            //初期化
            init(width, height, title = "") {
                //初期化
                this.canvas = document.getElementById("canvas");
                this.ctx = this.canvas.getContext("2d");

                //タイトル保存
                this.title = title;
                //HTMLのタイトルに反映
                document.title = this.title;
                
                //画面サイズ設定
                this.canvas.width = width;
                this.canvas.height = height;

                this.resize_canvas();

                this.last_window_width = window.innerWidth;
                this.last_window_height = window.innerHeight;

                window.addEventListener("resize", () => this.resize_canvas());

                //ゲームパッド用
                this.pad_map = {
                    a: 0,
                    b: 1,
                    x: 2,
                    y: 3,

                    lb: 4,
                    rb: 5,

                    lt: 6,
                    rt: 7,

                    select: 8,
                    start: 9,

                    ls: 10,
                    rs: 11,

                    up: 12,
                    down: 13,
                    left: 14,
                    right: 15
                }

                this.gamepad = {
                    buttons: [],
                    axes: []
                };

                //キー入力用
                this.keys = {};
                document.addEventListener("keydown", (e) => {
                    this.keys[e.key] = true;
                });
                document.addEventListener("keyup", (e) => {
                    this.keys[e.key] = false;
                });
                this.canvas.tabIndex = 1;
                this.canvas.focus();

                this.mouse = {x: 0, y: 0};
                this.mouse_x = 0;
                this.mouse_y = 0;
                this.mouse_down = false;
                this.mouse_clicked = false;

                //マルチタップ対応
                this.touches = {};

                const use_pointer = window.PointerEvent !== undefined;

                const update_input_from_event = (e, pointerId = null) => {
                    const pos = this.get_mouse_pos(e);
                    this.mouse.x = pos.x;
                    this.mouse.y = pos.y;
                    this.mouse_x = pos.x;
                    this.mouse_y = pos.y;

                    if (pointerId !== null) {
                        this.touches[pointerId] = {x: pos.x, y: pos.y};
                    }

                    return pos;
                };

                // マウス検知
                this.canvas.addEventListener("mousemove", (e) => {
                    update_input_from_event(e);
                });

                this.canvas.addEventListener("mousedown", e => {
                    update_input_from_event(e);

                    this.mouse_down = true;
                    this.mouse_clicked = true;
                });

                window.addEventListener("mouseup", () => {
                    this.mouse_down = false;
                });

                if (use_pointer) {
                    this.canvas.addEventListener("pointerdown", e => {
                        update_input_from_event(e, e.pointerId);
                        this.mouse_down = true;
                        this.mouse_clicked = true;
                    });

                    this.canvas.addEventListener("pointermove", e => {
                        if (this.touches[e.pointerId]) {
                            update_input_from_event(e, e.pointerId);
                        }
                    });

                    window.addEventListener("pointerup", e => {
                        delete this.touches[e.pointerId];
                        this.mouse_down = false;
                    });

                    this.canvas.addEventListener("pointercancel", e => {
                        delete this.touches[e.pointerId];
                        this.mouse_down = false;
                    });
                } else {
                    this.canvas.addEventListener("touchstart", e => {
                        e.preventDefault();
                        update_input_from_event(e, "touch");

                        this.mouse_down = true;
                        this.mouse_clicked = true;
                    }, {passive: false});

                    this.canvas.addEventListener("touchmove", e => {
                        e.preventDefault();
                        update_input_from_event(e, "touch");
                    }, {passive: false});

                    this.canvas.addEventListener("touchend", e => {
                        e.preventDefault();
                        delete this.touches.touch;
                        this.mouse_down = false;
                    }, {passive: false});

                    this.canvas.addEventListener("touchcancel", e => {
                        e.preventDefault();
                        delete this.touches.touch;
                        this.mouse_down = false;
                    }, {passive: false});
                }
            },

            width() {
                return this.canvas.width;
            },

            height() {
                return this.canvas.height;
            },

            center_x() {
                return this.canvas.width / 2;
            },

            center_y() {
                return this.canvas.height / 2;
            },


            //ゲームループ　update関数にはdeltaが渡される
            loop(update, draw = null) {
                let last_time = performance.now();
                const frame = () => {
                    const now = performance.now();
                    const delta = (now - last_time) / 1000;
                    last_time = now;
                    //画面サイズが変わっていたらリサイズ
                    if (window.innerWidth !== this.last_window_width ||
                        window.innerHeight !== this.last_window_height) {
                        this.last_window_width = window.innerWidth;
                        this.last_window_height = window.innerHeight;

                        this.resize_canvas();
                    }
                    this.update_gamepad();
                    update(delta);
                    if (draw !== null) {
                        draw();
                    }
                    this.mouse_clicked = false;
                    requestAnimationFrame(frame);
                }
                requestAnimationFrame(frame);
            },

            resize_canvas() {
                const w = document.documentElement.clientWidth;
                const h = document.documentElement.clientHeight;

                const scale = Math.min(
                    w / this.canvas.width,
                    h / this.canvas.height
                );

                this.canvas.style.width = (this.canvas.width * scale) + "px";
                this.canvas.style.height = (this.canvas.height * scale) + "px";
            },

            get_gamepad(index = 0) {
                const gp = navigator.getGamepads()[index];
                if (!gp) return null;
                return gp;
            },

            update_gamepad(index = 0) {
                const gp = navigator.getGamepads()[index];
                if (!gp) return;
                this.gamepad.buttons = gp.buttons.map(b => b.pressed);
                this.gamepad.axes = gp.axes;
            },

            pad_down(button, index = 0) {
                const gp = this.get_gamepad(index);
                if (!gp) return false;
                const btn = this.pad_map[button];
                if (btn === undefined) return false;
                const b = gp.buttons[btn];
                return b ? b.pressed : false;
            },

            stick_deadzone(value, dead = 0.2) {
                return Math.abs(value) < dead ? 0 : value;
            },

            left_stick(index = 0, dead = 0.2) {
                const pads = navigator.getGamepads();
                const gp = pads[index];
                if (!gp) return {x: 0, y: 0};
                const stick = {
                    x: gp.axes[0] || 0,
                    y: gp.axes[1] || 0
                };
                return {
                    x: this.stick_deadzone(stick.x, dead),
                    y: this.stick_deadzone(stick.y, dead)
                };
            },

            right_stick(index = 0, dead = 0.2) {
                const pads = navigator.getGamepads();
                const gp = pads[index];
                if (!gp) return {x: 0, y: 0};
                const stick = {
                    x: gp.axes[2] || 0,
                    y: gp.axes[3] || 0
                };
                return {
                    x: this.stick_deadzone(stick.x, dead),
                    y: this.stick_deadzone(stick.y, dead)
                };
            },

            key_down(key) {
                return this.keys[key] === true;
            },

            is_clicked() {
                return this.mouse_clicked;
            },

            get_mouse_pos(e = null) {
                if (!this.canvas) {
                    return {x: this.mouse_x || 0, y: this.mouse_y || 0};
                }

                let clientX = this.mouse_x;
                let clientY = this.mouse_y;

                if (e) {
                    const point = e.touches && e.touches[0] ? e.touches[0] : e.changedTouches && e.changedTouches[0] ? e.changedTouches[0] : e;
                    clientX = point.clientX ?? clientX;
                    clientY = point.clientY ?? clientY;
                }

                const rect = this.canvas.getBoundingClientRect();
                const scale_x = this.width() / rect.width;
                const scale_y = this.height() / rect.height;

                return {
                    x: (clientX - rect.left) * scale_x,
                    y: (clientY - rect.top) * scale_y
                };
            },

            get_touch_pos(pointerId) {
                const touch = this.touches[pointerId];
                if (!touch) return null;
                return {x: touch.x, y: touch.y};
            },

            //スマホの振動
            vibrate_phone(duration) {
                if (navigator.vibrate) {
                    navigator.vibrate(duration * 1000);
                }
            },

            //コントローラーの振動
            vibrate_gamepad(index, duration, strong = 1.0, weak = 1.0) {
                const gp = navigator.getGamepads()[index];
                if (!gp || !gp.vibrationActuator) return;
                gp.vibrationActuator.playEffect("dual-rumble", {
                    duration: duration * 1000,
                    strongMagnitude: strong,
                    weakMagnitude: weak
                });
            },

            //画面全体塗りつぶし
            clear_color(color) {
                this.ctx.fillStyle = color;
                this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
            },

            load_image(path) {
                const img = {
                    bitmap: null,
                    ready: false
                };

                const image = new Image();
                image.src = path;

                image.onload = () => {
                    createImageBitmap(image).then(bmp => {
                        img.bitmap = bmp;
                        img.ready = true;
                    });
                };

                return img;
            },

            draw_image(
                img,
                x,
                y,
                w = null,
                h = null,
                flipX = false,
                flipY = false,
                angle_deg = 0
            ) {
                if (img.ready === false) return;

                const source = img.bitmap || img;

                const W = w ?? (source.width  || source.videoWidth);
                const H = h ?? (source.height || source.videoHeight);

                const angle = angle_deg * Math.PI / 180;

                this.ctx.save();
                this.ctx.translate(x + W / 2, y + H / 2);
                this.ctx.rotate(angle);
                this.ctx.scale(flipX ? -1 : 1, flipY ? -1 : 1);
                this.ctx.drawImage(source, -W / 2, -H / 2, W, H);
                this.ctx.restore();
            },

            //エリアの位置に画像をかく
            area_to_image(img, area) {
                this.draw_image(img, area.x, area.y, area.w, area.h);
            },

            load_video(path) {
                const video = document.createElement("video");
                video.src = path;
                video.loop = true;
                video.muted = true;
                video.playsInline = true;   // iPhone対策
                video.ready = false;

                video.addEventListener("canplay", () => {
                    video.ready = true;
                    video.play();
                });

                video.load();

                return video;
            },

            draw_video(
                video,
                x,
                y,
                w = video.videoWidth,
                h = video.videoHeight,
                flipX = false,
                flipY = false,
                angle_deg = 0,
            ) {
                if (!video.ready || video.videoWidth === 0) return;
                
                this.ctx.save();

                // 中心へ移動
                this.ctx.translate(x + w / 2, y + h / 2);

                const angle = angle_deg * Math.PI / 180;
                // 回転
                this.ctx.rotate(angle);

                // 反転
                this.ctx.scale(
                    flipX ? -1 : 1,
                    flipY ? -1 : 1
                );

                // 中心基準で描画
                this.ctx.drawImage(video, -w / 2, -h / 2, w, h);

                this.ctx.restore();
            },

            draw_text(text, x, y, size = 32, color = "black") {
                this.ctx.fillStyle = color;
                this.ctx.font = `${size}px "this.font_name"`;
                this.ctx.textAlign = "center"
                this.ctx.textBaseline = "middle";
                this.ctx.fillText(text, x, y);
            },

            set_font(name) {
                this.font_name = name
            },

            draw_rect(x, y, w, h, color) {
                this.ctx.fillStyle = color;
                this.ctx.fillRect(x, y, w, h);
            },

            draw_line(x1, y1, x2, y2, color = "white", width = 2) {
                this.ctx.strokeStyle = color;
                this.ctx.lineWidth = width;
                this.ctx.beginPath();
                this.ctx.moveTo(x1, y1);
                this.ctx.lineTo(x2, y2);
                this.ctx.stroke();
            },

            //画像全消去
            clear() {
                this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
            },

            //エリア生成
            area(x, y, w, h) {
                return {x, y, w, h};
            },

            //二つの当たり判定が当たっているか調べる
            collision(area1, area2) {
                return (
                    area1.x < area2.x + area2.w &&
                    area1.x + area1.w > area2.x &&
                    area1.y < area2.y + area2.h &&
                    area1.y + area1.h > area2.y
                )
            },

            point_area(x, y, area) {
                return (
                    x >= area.x &&
                    x <= area.x + area.w &&
                    y >= area.y &&
                    y <= area.y + area.h
                );
            },

            rand_int(min, max) {
                return Math.floor(Math.random() * (max - min + 1)) + min;
            }
        }
    </script>
    <script src="main.js"></script>
</body>
</html>
